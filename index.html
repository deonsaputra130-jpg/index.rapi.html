<!doctype html><html lang='id'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#020611'><title>Eonux — UI/UX Designer</title><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#f5f8ff;background:#020611;font-family:Inter,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 18% 5%,#0d3c72 0,transparent 28%),radial-gradient(circle at 88% 38%,#25115a 0,transparent 27%),linear-gradient(135deg,#02040a,#061328 58%,#02040a)}
body:after{content:"";position:fixed;inset:0;z-index:-2;opacity:.25;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:83px 83px}
a{color:inherit;text-decoration:none}.wrap{width:min(1180px,92%);margin:auto}
nav{height:74px;display:flex;align-items:center;justify-content:flex-end;gap:28px;border-bottom:1px solid #1b3d65;position:sticky;top:0;background:#020611dd;backdrop-filter:blur(14px);z-index:10}
.logo{position:absolute;left:4%;font:700 18px 'Space Grotesk';letter-spacing:1px}.logo i{color:#4fc3ff;font-style:normal}nav a{font-size:12px;color:#aebbd0}nav a:hover{color:#fff}
.hero{min-height:88vh;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:30px}.hero-copy{padding:70px 0}.kicker,.eyebrow{color:#57c3ff;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:800}.hero h1{font:700 clamp(58px,9vw,105px)/.9 'Space Grotesk';margin:14px 0;background:linear-gradient(100deg,#fff,#8bcfff);-webkit-background-clip:text;color:transparent}.hero h2{font:600 20px 'Space Grotesk';margin:0 0 15px}.hero p{max-width:550px;color:#a9b8cc;line-height:1.8}.btn{display:inline-flex;padding:12px 20px;border:1px solid #40b8ff;border-radius:30px;margin-top:22px;background:#09213e;box-shadow:0 0 28px #138cff20;font-size:13px}.hero-art{position:relative;min-height:620px}.earth-art{position:absolute;width:min(600px,90vw);aspect-ratio:1;right:-6%;top:8%;border-radius:50%;object-fit:cover;filter:drop-shadow(0 0 45px #168dff88)}.orb{position:absolute;border:1px solid #6bc9ff77;border-radius:50%;width:110px;height:110px;right:5%;top:8%;box-shadow:0 0 25px #229cff55}.orb:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;left:47px;top:47px}
section{padding:92px 0;border-top:1px solid #153252}.section-title{font:600 40px/1.1 'Space Grotesk';margin:8px 0}.muted{color:#94a6bd}.about-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:50px}.traits{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.trait,.card{border:1px solid #21466e;background:#061324dd;border-radius:16px;box-shadow:inset 0 0 35px #0c2b4b30}.trait{padding:18px;text-align:center;color:#b9c9dc;font-size:12px}.trait b{display:block;color:#fff;margin-top:7px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project{padding:0;overflow:hidden}.fake-img{height:150px;background:linear-gradient(135deg,#102c4e,#183c63 50%,#071120);display:grid;place-items:center;font:600 17px 'Space Grotesk';color:#b9ddff}.project>div:last-child{padding:20px}.project h3{margin:4px 0 8px}.num{color:#53c2ff;font-size:11px;letter-spacing:2px}.tag{display:inline-block;border:1px solid #31557b;border-radius:99px;padding:4px 8px;color:#83cfff;font-size:10px;margin-right:4px}
.planet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.planet{overflow:hidden;cursor:pointer;transition:.2s}.planet:hover{transform:translateY(-4px);border-color:#53c5ff}.planet img{display:block;width:100%;height:180px;object-fit:cover;background:#02050a}.planet .ptext{padding:15px}.planet h3{font:600 18px 'Space Grotesk';margin:0 0 2px}.planet small{color:#8297b0}
.contact{min-height:55vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:50px}.contact-art{height:360px;border-radius:25px;background:radial-gradient(circle at 70% 45%,#fff 0,#7bcaff 2%,transparent 8%),linear-gradient(135deg,#0a2744,#030817);border:1px solid #2c5b86;position:relative;overflow:hidden}.contact-art:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-50px;top:45px;background:radial-gradient(circle,#2e7eb5,#071427 68%);box-shadow:0 0 90px #318bca88}
.detail{padding:60px 0 100px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.detail-img{width:100%;max-height:600px;object-fit:contain;border-radius:25px;border:1px solid #315a82;background:#02050a;box-shadow:0 0 80px #168dff22}.back{color:#6ecaff;font-size:12px;cursor:pointer}.detail h1{font:700 clamp(50px,7vw,78px)/.95 'Space Grotesk';margin:13px 0 7px}.detail h2{font:600 18px 'Space Grotesk'}.detail p{color:#9fb0c7;line-height:1.85}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:25px 0}.fact{padding:14px;border:1px solid #21466e;background:#071426;border-radius:12px;color:#dceaff}.fact b{display:block;color:#58c2ff;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}.detail-nav{display:flex;justify-content:space-between;border-top:1px solid #1c3856;margin-top:45px;padding-top:22px;color:#68c8ff;cursor:pointer}
footer{border-top:1px solid #153252;padding:35px 0;color:#71839c;font-size:12px;text-align:center}
@media(max-width:850px){.hero,.about-grid,.contact,.detail-grid{grid-template-columns:1fr}.hero-art{min-height:420px}.earth-art{width:430px;right:0}.cards{grid-template-columns:1fr 1fr}.planet-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){nav{gap:11px;justify-content:center;height:auto;padding:16px 0}.logo{display:none}.hero{min-height:auto;padding:55px 0}.hero-art{min-height:310px}.earth-art{width:320px;right:-15px;top:5%}.cards,.planet-grid{grid-template-columns:1fr}.traits{grid-template-columns:1fr}.section-title{font-size:34px}.contact-art{height:250px}}

function showDetail(slug){
const p=P.find(x=>x.slug===slug);if(!p)return;
document.title=p.name+" — Eonux";
document.body.innerHTML=nav()+`<main class="wrap detail"><a class="back" onclick="home()">← Back to Gallery</a><div class="detail-grid"><div><img class="detail-img" src="${p.img}" alt="${p.name}"></div><div><div class="eyebrow">SOLAR SYSTEM</div><h1>${p.name}</h1><h2>${p.title}</h2><p>${p.desc}</p><div class="facts"><div class="fact"><b>Diameter</b>${p.diam}</div><div class="fact"><b>Day Length</b>${p.day}</div><div class="fact"><b>Year / Period</b>${p.year}</div><div class="fact"><b>Moons</b>${p.moons}</div></div><span class="tag">SPACE</span><span class="tag">EDUCATIONAL</span></div></div><div class="detail-nav"><a onclick="home();setTimeout(()=>location.hash='planets',50)">← Solar System</a><a onclick="nextPlanet('${p.slug}')">Next →</a></div></main><footer>Eonux — Space Portfolio</footer>`;
window.scrollTo(0,0);
}
function nextPlanet(slug){let i=P.findIndex(x=>x.slug===slug);showDetail(P[(i+1)%P.length].slug)}
function route(){let h=location.hash.slice(1);if(P.some(x=>x.slug===h))showDetail(h);else home()}
window.addEventListener("hashchange",route);route();
</script></body></html>
